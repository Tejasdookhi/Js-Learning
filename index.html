<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Expenses</title>
</head>
<link rel="stylesheet" href="split.css">
<body>
    <div class="body">
       <h1>Split Our Expenses</h1>    
     
       <label>Bill Amount(₹):</label>
       <input id="bill" type="number" placeholder="Enter Billing Amount" >


       <label>Tip Amount(₹):</label>
       <input id="tip" type="number" placeholder="Enter Tip Amount" >


       <label>Total Person:</label>
       <input id="person" type="number" placeholder="Total Person" >

       <button onclick="calculateExp()">Calculate</button>

       <div class="result" id="result" ></div>

    </div>
    
<script src="split.js"></script>
</body>
</html>
